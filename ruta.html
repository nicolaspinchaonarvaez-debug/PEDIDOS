<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domicilios · La Ermita</title>
<meta name="theme-color" content="#B3161E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos Ermita">
<style>
:root{--bg:#F6F4F4;--surface:#fff;--ink:#1A1516;--muted:#857B7D;--line:#ECE7E7;--accent:#B3161E;--soft:#FBEDEE;--ok:#16794A;--ok-bg:#E4F4EA;--warn:#9A6500;--warn-bg:#FFF3DC}
@media (prefers-color-scheme:dark){:root{--bg:#0F0D0D;--surface:#1A1718;--ink:#F3EEEE;--muted:#9D9294;--line:#2A2526;--soft:#35191C;--ok:#5CCB8E;--ok-bg:#132A1D;--warn:#F0C066;--warn-bg:#33270F}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:0 18px;display:grid;gap:12px}
.hd{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 8px;display:flex;align-items:center;gap:12px}
.hd img{width:38px;height:38px;object-fit:contain}
.hd .t{flex:1;min-width:0}
.hd b{display:block;font-size:1.3rem;letter-spacing:-.01em}
.hd span{display:block;font-size:.85rem;color:var(--muted)}
.ic{appearance:none;border:0;background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.06);flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.go{background:var(--accent);color:#fff}
.btn{appearance:none;border:0;background:var(--surface);color:var(--ink);font:600 .95rem system-ui,-apple-system,sans-serif;padding:12px 16px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:46px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:#16794A;color:#fff}
.btn.suave{background:var(--soft);color:var(--accent)}
@media (prefers-color-scheme:dark){.btn.suave{color:#F2959A}.stop .n{color:#F2959A}.stop.ruta .n{color:#fff}}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.88rem;border-radius:12px}
.btn.full{width:100%}
.btn.ghost{background:none;color:var(--muted)}
.btn.line{background:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.gps{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 12px 12px 16px}
.gps .tx{flex:1;min-width:0;display:grid}
.gps .tx b{font-size:.95rem}
.gps .tx small{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:11px;height:11px;border-radius:50%;background:#C4BBBD;flex:none}
.gps.on .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(22,121,74,.55);animation:pulso 1.8s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(22,121,74,0)}100%{box-shadow:0 0 0 0 rgba(22,121,74,0)}}
.sec{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 4px -2px}
.stop{background:var(--surface);border-radius:20px;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
.stop .n{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.95rem;align-self:start}
.stop.ruta .n{background:var(--accent);color:#fff}
.stop .info{min-width:0;display:grid;gap:3px}
.stop .dir{font-size:1.08rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.stop .sub{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.gris{background:var(--line);color:var(--muted)}
.stop .acts{display:flex;gap:8px;align-self:start}
.stop .pie{grid-column:1/-1;display:grid;gap:6px;margin-top:8px}
.stop .pie .fila{display:flex;gap:8px}
.stop .pie .fila .btn{flex:1}
.vacio{text-align:center;color:var(--muted);padding:34px 10px 10px;display:grid;justify-items:center;gap:6px}
.vacio img{width:170px;opacity:.95}
.vacio b{color:var(--ink);font-size:1.05rem}
.menu{background:var(--surface);border-radius:20px;padding:6px;display:grid}
.menu>button,.menu>a{appearance:none;border:0;background:none;color:var(--ink);text-align:left;font:500 .95rem system-ui,sans-serif;padding:13px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.menu>button+button,.menu>button+a,.menu>a+button{border-top:1px solid var(--line);border-radius:0}
.menu .rojo{color:var(--accent)}
.menu .det{padding:4px 12px 14px;font-size:.88rem;display:grid;gap:10px}
.menu .det ol{margin:0;padding-left:20px;display:grid;gap:8px}
.copia{display:flex;gap:8px;margin-top:6px}
.copia input{flex:1;min-width:0;font:14px system-ui;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.copia .btn{flex:none;min-height:40px;background:var(--bg)}
.login{max-width:360px;margin:9vh auto 0;display:grid;gap:12px;text-align:center}
.login img{width:190px;margin:0 auto}
.login b{font-size:1.35rem}
.login span{color:var(--muted);font-size:.92rem}
.login form{display:grid;gap:10px;text-align:left;margin-top:6px}
input.campo{font:inherit;font-size:16px;padding:14px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);width:100%}
.err{color:var(--accent);font-weight:600;font-size:.88rem;min-height:1.2em;text-align:center}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#1A1516;color:#fff;padding:12px 14px;border-radius:14px;font-size:.92rem;text-align:center;z-index:20;max-width:480px;margin:0 auto}
.mini{font-size:.8rem;color:var(--muted);text-align:center}
.mini a{color:inherit}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="toast" class="toast" hidden></div>
<script>
  // Enlace de la aplicación web de Apps Script (el mismo de index.html)
  var EXEC = "https://script.google.com/macros/s/AKfycbx9whr0i8j4DMhuGydpvtXli5lIWxiq545MBosLZ5Tr4EsHHAPrQKnhrYA3pmC6XFCC/exec";
  var VAPID = "BAyxDJpOMglZAyqAakLi8wYy9LiTFz0OUg3iMfm8_f5n0RQj_Hz531oPTrzjPy3Aa-tQLIwOhv1Z1VhoMZmkaaY";
  var CIUDAD = "Pasto, Nariño, Colombia";
</script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} } };
  var ses = null; try { ses = JSON.parse(ls.get("ermita-ruta") || "null"); } catch (e) {}
  // Llega desde la app de pedidos ya con la sesión: no hay que volver a ingresar.
  (function () {
    var m = location.hash.match(/[#&]s=([\w-]+)/); if (!m) return;
    try {
      var t = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "=";
      var o = JSON.parse(decodeURIComponent(escape(atob(t))));
      if (o && o.token && o.yo) { ses = o; ls.set("ermita-ruta", JSON.stringify(ses)); ls.set("ermita-modo", "ruta"); }
    } catch (e) {}
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  })();
  var pedidos = [], cargando = false, msgErr = "", confirmar = null;
  var activo = ls.get("ermita-ruta-activo") === "1", watchId = null, ultimaPos = null, enviada = { t: 0, lat: 0, lng: 0 }, enviando = false, geoErr = "", wake = null;
  var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var regP = ("serviceWorker" in navigator) ? navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; }) : Promise.reject("sin sw");
  regP.catch(function () {});

  function toast(t) { var e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 3500); }
  // Se habla con Google por JSONP (etiqueta <script>), que el iPhone no bloquea.
  function jsonp(obj) {
    return new Promise(function (res, rej) {
      var cb = "rcb" + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement("script");
      var fin = function () { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); };
      var t = setTimeout(function () { fin(); rej(new Error("TIEMPO")); }, 30000);
      window[cb] = function (j) { fin(); res(j); };
      s.onerror = function () { fin(); rej(new Error("SIN_SERVIDOR")); };
      s.src = EXEC + "?cb=" + cb + "&d=" + encodeURIComponent(JSON.stringify(obj)) + "&_=" + Date.now();
      document.head.appendChild(s);
    });
  }
  function api(accion, datos) {
    var cuerpo = Object.assign({ accion: accion, token: ses && ses.token }, datos || {});
    return jsonp(cuerpo).then(function (j) {
      if (j && j.error) {
        if (/SESION_INVALIDA/.test(j.error) && accion !== "login") salir(true);
        throw new Error(j.error);
      }
      return j;
    });
  }
  var ERR = { CREDENCIALES: "Usuario o PIN incorrecto.", BLOQUEADO: "Demasiados intentos. Espera 10 minutos.", NO_DOMICILIARIO: "Este usuario no es domiciliario. Pídele al administrador que le cambie el rol." };
  function errTxt(e) { var m = String(e && e.message || e); for (var k in ERR) if (m.indexOf(k) >= 0) return ERR[k]; if (/SIN_SERVIDOR|TIEMPO/.test(m)) return navigator.onLine === false ? "Sin conexión. Revisa los datos o el wifi." : "No se pudo conectar con el servidor de Google. Toca «Probar conexión» abajo.";
    if (/ACCION_DESCONOCIDA|rutaApi_|doGet/.test(m)) return "Falta actualizar Código.gs y publicar una Nueva versión.";
    return /Failed to fetch|NetworkError|Load failed/i.test(m) ? "Sin conexión. Revisa los datos o el wifi." : "No se pudo completar (" + m.slice(0, 80) + ")."; }

  /* ---------- pantallas ---------- */
  var IC = {
    ir: '<svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
    tel: '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    menu: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>'
  };
  var menuAbierto = false;
  function pintar() {
    if (!ses) return pintarLogin();
    var r = $("#raiz"), y = window.scrollY;
    var pend = pedidos.filter(function (p) { return p.estado === "ruta" || p.estado === "listo"; }).length;
    r.innerHTML = '<header class="hd"><img src="icon-192.png" alt=""><div class="t"><b>Hola, ' + esc(ses.yo.nombre.split(" ")[0]) + '</b><span>' +
      (pend ? pend + (pend === 1 ? " entrega pendiente" : " entregas pendientes") : "Domicilios · Carnes La Ermita") + '</span></div>' +
      '<button class="ic" data-a="menu" aria-label="Opciones">' + IC.menu + '</button></header><main>' +
      (menuAbierto ? tarjetaMenu() : '') + barraGps() + '<div id="pend" class="mini"' + (cola.length ? '' : ' hidden') + '>Enviando ' + cola.length + ' cambio' + (cola.length > 1 ? 's' : '') + '…</div>' + listaPedidos() + '</main>';
    window.scrollTo(0, y);
  }
  function pintarLogin(msg) {
    $("#raiz").innerHTML = '<main><div class="login"><img src="moto.webp" alt="Domiciliario de Carnes La Ermita">' +
      '<b>Domicilios</b><span>Ingresa con tu usuario y PIN</span>' +
      '<form id="flogin"><input class="campo" id="l-u" placeholder="Usuario" autocomplete="username" autocapitalize="none" required>' +
      '<input class="campo" id="l-p" type="password" placeholder="PIN" inputmode="numeric" maxlength="8" autocomplete="current-password" required>' +
      '<div class="err" id="l-e">' + esc(msg || "") + '</div><button class="btn primary full" id="l-b">Ingresar</button></form>' +
      '<p class="mini"><a href="' + EXEC + '?ping=1" target="_blank" rel="noopener">Probar conexión</a> · <a href="index.html?app">App de pedidos</a></p></div></main>';
    $("#flogin").onsubmit = function (e) {
      e.preventDefault(); var b = $("#l-b"); b.disabled = true; b.textContent = "Ingresando…";
      jsonp({ accion: "login", usuario: $("#l-u").value.trim().toLowerCase(), pin: $("#l-p").value.trim() })
        .then(function (j) {
          if (j.error) throw new Error(j.error);
          ses = { token: j.token, yo: j.yo }; ls.set("ermita-ruta", JSON.stringify(ses)); ls.set("ermita-modo", "ruta");
          pintar(); cargarPedidos(); cargarRastreo(); revisarAvisos(); if (activo) iniciar();
        }).catch(function (err) { $("#l-e").textContent = errTxt(err); b.disabled = false; b.textContent = "Ingresar"; });
    };
  }
  function hace(ms) { var s = Math.round(ms / 1000); return s < 60 ? "hace " + s + " s" : "hace " + Math.round(s / 60) + " min"; }
  function textoGps() {
    var fondo = trk && trk.traccar != null && trk.traccar < 600;
    if (!activo) return fondo ? "Llega por Traccar · " + hace(trk.traccar * 1000) : "El equipo no ve dónde estás";
    if (geoErr) return geoErr;
    return enviada.t ? "Enviada " + hace(Date.now() - enviada.t) + (ultimaPos ? " · ±" + ultimaPos.acc + " m" : "") : "Buscando señal…";
  }
  function barraGps() {
    var fondo = trk && trk.traccar != null && trk.traccar < 600, on = activo || fondo;
    return '<div class="gps ' + (on ? "on" : "") + '"><span class="dot"></span><div class="tx"><b>' + (on ? "Ubicación activa" : "Ubicación apagada") + '</b><small id="r-sub">' + esc(textoGps()) + '</small></div>' +
      (activo ? '<button class="btn sm line" data-a="terminar">Terminar</button>' : '<button class="btn sm primary" data-a="iniciar">Iniciar</button>') + '</div>';
  }
  var trk = null, trkAbierto = false;
  function cargarRastreo() { api("rastreo").then(function (j) { trk = j; if (!confirmar) pintar(); }).catch(function () {}); }
  function tarjetaMenu() {
    var ok = trk && trk.traccar != null && trk.traccar < 600, tienda = esIOS ? "App Store" : "Play Store";
    var avisos = ("Notification" in window) && ("PushManager" in window) && Notification.permission === "default";
    return '<div class="menu">' +
      (avisos ? '<button data-a="avisos">🔔 Activar avisos</button>' : '') +
      (ses.yo.rol === "admin" ? '<a href="index.html?app" data-a="irApp">↩ App de pedidos</a>' : '') +
      '<button data-a="salir" class="rojo">Cerrar sesión</button></div>';
  }
  function listaPedidos() {
    var ruta = pedidos.filter(function (p) { return p.estado === "ruta"; }),
        salir = pedidos.filter(function (p) { return p.estado !== "ruta"; });
    var h = "";
    if (ruta.length) h += '<div class="sec">En camino</div>' + ruta.map(function (p, i) { return parada(p, i + 1); }).join("");
    if (salir.length) h += '<div class="sec">Por salir</div>' + salir.map(function (p) { return parada(p, 0); }).join("");
    if (!h) h = '<div class="vacio"><img src="moto.webp" alt=""><b>' + (cargando ? "Cargando…" : msgErr ? esc(msgErr) : "Sin entregas por ahora") + '</b>' +
      (cargando || msgErr ? "" : '<span>Te avisamos cuando haya un domicilio listo.</span>') + '</div>';
    return h;
  }
  function parada(p, n) {
    var dir = p.direccion ? 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(p.direccion + ", " + CIUDAD) : "";
    var tel = String(p.telefono || "").replace(/[^\d+]/g, "");
    var enRuta = p.estado === "ruta";
    var sub = [esc(p.cliente || "Sin nombre")];
    if (p.hora) sub.push(esc(p.hora));
    var tags = (p.pagado ? '' : '<span class="tag">Cobrar' + (p.formaPago && p.formaPago !== "Efectivo" ? " · " + esc(p.formaPago) : "") + '</span>') +
      (!enRuta && p.estado !== "listo" ? '<span class="tag gris">Alistando</span>' : '');
    var acts = '<div class="acts">' + (tel ? '<a class="ic" href="tel:' + esc(tel) + '" aria-label="Llamar">' + IC.tel + '</a>' : '') +
      (dir && enRuta ? '<a class="ic go" href="' + dir + '" target="_blank" rel="noopener" aria-label="Cómo llegar">' + IC.ir + '</a>' : '') + '</div>';
    var pie;
    if (enRuta) pie = confirmar === p.id
      ? '<div class="fila"><button class="btn ok" data-a="entregar" data-id="' + p.id + '">Sí, entregado</button><button class="btn line" data-a="noConfirmar">Cancelar</button></div>' +
        '<button class="btn ghost sm" data-a="devolver" data-id="' + p.id + '">No se pudo entregar · volver al local</button>'
      : '<button class="btn ok full" data-a="preEntregar" data-id="' + p.id + '">Entregado</button>';
    else pie = '<button class="btn suave full" data-a="salirEntregar" data-id="' + p.id + '">Salir a entregar</button>';
    return '<article class="stop ' + (enRuta ? "ruta" : "") + '"><span class="n">' + (n || "•") + '</span>' +
      '<div class="info"><span class="dir">' + (p.direccion ? esc(p.direccion) : "Sin dirección") + '</span><span class="sub">' + sub.join(" · ") + tags + '</span></div>' +
      acts + '<div class="pie">' + pie + '</div></article>';
  }
  function refrescarEstado() { var sub = $("#r-sub"); if (sub) sub.textContent = textoGps(); }

  /* ---------- pedidos ---------- */
  // La lista se guarda en el celular: al abrir se ve al instante y luego se actualiza.
  try { pedidos = JSON.parse(ls.get("ermita-ruta-ped") || "[]") || []; } catch (e) { pedidos = []; }
  var cola = []; try { cola = JSON.parse(ls.get("ermita-ruta-cola") || "[]") || []; } catch (e) { cola = []; }
  var procesando = false;
  function guardarLocal() { ls.set("ermita-ruta-ped", JSON.stringify(pedidos)); ls.set("ermita-ruta-cola", JSON.stringify(cola)); }
  function aplicarCambio(lista, c) {
    if (c.estado === "entregado") return lista.filter(function (p) { return p.id !== c.id; });
    lista.forEach(function (p) { if (p.id === c.id) { p.estado = c.estado; if (c.estado === "ruta") p.domiciliario = ses && ses.yo.nombre; } });
    return lista;
  }
  function cargarPedidos() {
    if (!ses) return; cargando = !pedidos.length;
    api("pedidos").then(function (j) {
      var lista = j.pedidos || [];
      cola.forEach(function (c) { lista = aplicarCambio(lista, c); });   // lo que aún no llega al servidor
      pedidos = lista; msgErr = ""; cargando = false; guardarLocal(); if (!confirmar) pintar();
    }).catch(function (e) { cargando = false; msgErr = errTxt(e); if (!pedidos.length) pintar(); });
  }
  // Cambia el pedido al instante en pantalla y lo envía en segundo plano (reintenta si no hay señal).
  function cambiar(id, estado) {
    confirmar = null;
    pedidos = aplicarCambio(pedidos, { id: id, estado: estado });
    cola.push({ id: id, estado: estado, t: Date.now() }); guardarLocal(); pintar();
    toast(estado === "ruta" ? "Saliste con el pedido." : estado === "entregado" ? "¡Entregado! Buen trabajo." : "Pedido devuelto al local.");
    if (estado === "entregado" && activo && !pedidos.some(function (p) { return p.estado === "ruta"; }))
      setTimeout(function () { toast("No te quedan pedidos en ruta. Si terminaste, toca Terminar."); }, 3600);
    procesarCola();
  }
  function procesarCola() {
    if (procesando || !cola.length || !ses) return;
    procesando = true;
    var c = cola[0];
    api("estado", { id: c.id, estado: c.estado }).then(function () {
      cola.shift(); guardarLocal();
      api("avisarEstado", { id: c.id, estado: c.estado }).catch(function () {});   // avisos al equipo, sin esperar
      procesando = false; pintarPendientes(); procesarCola();
    }).catch(function (e) {
      procesando = false;
      var m = String(e && e.message || e);
      if (/NO_EXISTE|DATOS_INVALIDOS/.test(m)) { cola.shift(); guardarLocal(); toast("Ese pedido ya no existe. Se actualizó la lista."); cargarPedidos(); procesarCola(); return; }
      if (/SESION/.test(m)) return;
      pintarPendientes(); setTimeout(procesarCola, 6000);   // sin señal: vuelve a intentar
    });
  }
  function pintarPendientes() { var e = $("#pend"); if (e) { e.hidden = !cola.length; e.textContent = cola.length ? "Enviando " + cola.length + " cambio" + (cola.length > 1 ? "s" : "") + "…" : ""; } }

  /* ---------- ubicación ---------- */
  function dist(a, b) { var R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
    var h = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2); return 2 * R * Math.asin(Math.sqrt(h)); }
  function rumbo(a, b) { var r = Math.PI / 180, y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r),
    x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r); return (Math.atan2(y, x) / r + 360) % 360; }
  function enviar(forzar) {
    if (!ses || !ultimaPos || enviando) return;
    var ahora = Date.now(), lejos = enviada.t ? dist(enviada, ultimaPos) : 1e9;
    if (!forzar && ahora - enviada.t < 15000 && !(lejos > 30 && ahora - enviada.t > 5000)) return;
    enviando = true;
    var pos = { lat: ultimaPos.lat, lng: ultimaPos.lng, acc: ultimaPos.acc, rumbo: ultimaPos.rumbo, vel: ultimaPos.vel };
    api("ubicacion", { pos: pos, activo: true }).then(function () { enviada = { t: Date.now(), lat: pos.lat, lng: pos.lng }; geoErr = ""; })
      .catch(function (e) { if (!/SESION/.test(String(e))) geoErr = "No se pudo enviar: " + errTxt(e); })
      .then(function () { enviando = false; refrescarEstado(); });
  }
  function bienPos(p) {
    var c = p.coords, n = { lat: c.latitude, lng: c.longitude, acc: Math.round(c.accuracy || 0), vel: c.speed, rumbo: c.heading };
    if ((n.rumbo == null || isNaN(n.rumbo)) && ultimaPos) { n.rumbo = dist(ultimaPos, n) > 8 ? rumbo(ultimaPos, n) : ultimaPos.rumbo; }
    ultimaPos = n; geoErr = ""; enviar(false); refrescarEstado();
  }
  function malPos(e) {
    geoErr = e.code === 1 ? (esIOS ? "Permite la ubicación: Ajustes → Privacidad → Localización → Safari (o la app) → Mientras se usa." : "Permite la ubicación para esta app en los ajustes del celular.")
      : e.code === 3 ? "Buscando señal de GPS…" : "No se pudo obtener la ubicación.";
    refrescarEstado();
  }
  function pedirPantalla() {
    if (!activo || !("wakeLock" in navigator) || document.hidden) return;
    navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {});
  }
  function iniciar() {
    if (!("geolocation" in navigator)) { toast("Este celular no permite compartir la ubicación."); return; }
    activo = true; ls.set("ermita-ruta-activo", "1");
    if (watchId == null) watchId = navigator.geolocation.watchPosition(bienPos, malPos, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
    pedirPantalla(); pintar();
  }
  function terminar() {
    activo = false; ls.set("ermita-ruta-activo", null);
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    api("ubicacion", { pos: ultimaPos, activo: false }).catch(function () {});
    enviada = { t: 0, lat: 0, lng: 0 }; pintar(); toast("Recorrido terminado.");
  }
  function salir(vencida) {
    if (activo && !vencida) terminar();
    if (!vencida && ses) jsonp({ accion: "salir", token: ses.token }).catch(function () {});
    ses = null; ls.set("ermita-ruta", null); ls.set("ermita-modo", null); pedidos = []; cola = []; ls.set("ermita-ruta-ped", null); ls.set("ermita-ruta-cola", null);
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    activo = false; ls.set("ermita-ruta-activo", null);
    pintarLogin(vencida ? "Tu sesión se cerró. Ingresa de nuevo." : "");
  }

  /* ---------- avisos ---------- */
  function claveBytes() { var s = VAPID.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function registrarSub(s) { return api("push", { sub: s.toJSON(), disp: esIOS ? "iPhone (domicilios)" : /Android/i.test(navigator.userAgent) ? "Android (domicilios)" : "Computador (domicilios)" }); }
  function revisarAvisos() {
    if (!ses || !("Notification" in window) || Notification.permission !== "granted") return;
    regP.then(function (reg) { return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveBytes() }); }); })
      .then(registrarSub).catch(function () {});
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a"), id = b.getAttribute("data-id");
    if (a === "irApp") { ls.set("ermita-modo", null); return; }
    e.preventDefault();
    if (a === "iniciar") iniciar();
    else if (a === "terminar") terminar();
    else if (a === "salir") salir(false);
    else if (a === "salirEntregar") { if (!activo) iniciar(); cambiar(id, "ruta"); }
    else if (a === "preEntregar") { confirmar = id; pintar(); setTimeout(function () { if (confirmar === id) { confirmar = null; pintar(); } }, 6000); }
    else if (a === "noConfirmar") { confirmar = null; pintar(); }
    else if (a === "entregar") cambiar(id, "entregado");
    else if (a === "devolver") cambiar(id, "listo");
    else if (a === "menu") { menuAbierto = !menuAbierto; pintar(); if (menuAbierto) window.scrollTo(0, 0); }
    else if (a === "trk") { trkAbierto = !trkAbierto; pintar(); }
    else if (a === "trkRevisar") { toast("Revisando…"); cargarRastreo(); }
    else if (a === "copiar") { var inp = document.getElementById(b.getAttribute("data-v")); inp.select(); try { navigator.clipboard.writeText(inp.value).then(function () { toast("Copiado"); }, function () { document.execCommand("copy"); toast("Copiado"); }); } catch (x) { document.execCommand("copy"); toast("Copiado"); } }
    else if (a === "avisos") {
      b.disabled = true;
      regP.then(function (reg) { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveBytes() }); })
        .then(registrarSub).then(function () { toast("Avisos activados ✓"); pintar(); })
        .catch(function () { toast(Notification.permission === "denied" ? "Bloqueaste los avisos. Actívalos en los ajustes del celular." : "No se pudieron activar los avisos."); pintar(); });
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    pedirPantalla(); cargarPedidos(); cargarRastreo(); if (activo) enviar(true);
  });
  setInterval(function () { if (!document.hidden && ses) cargarPedidos(); }, 45000);
  setInterval(function () { if (activo && !document.hidden) { if (Date.now() - enviada.t > 30000) enviar(true); refrescarEstado(); } }, 10000);

  window.addEventListener("online", procesarCola);
  if (ses) { pintar(); cargarPedidos(); procesarCola(); cargarRastreo(); revisarAvisos(); if (activo) iniciar(); } else pintarLogin();
})();
</script>
</body>
</html>
