<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos La Ermita</title>
<meta name="theme-color" content="#B3161E">
<meta name="description" content="Pedidos y domicilios de Carnes La Ermita">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos Ermita">
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;display:grid;place-items:center;background:#FFFFFF;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#7B6F70;transition:opacity .3s;z-index:2}
  #splash img{width:160px;max-width:50vw;display:block;margin:0 auto 14px}
  #splash.oculto{opacity:0;pointer-events:none}
  .pbtn{display:inline-block;border:0;background:#B3161E;color:#fff;text-decoration:none;font:700 16px system-ui,-apple-system,sans-serif;padding:14px 26px;border-radius:14px;margin:10px 0 6px;cursor:pointer}
  .pbtn.sec{background:transparent;color:#7B6F70;font-weight:600;padding:10px 18px}
  #hoja{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:18px 18px 10px;font-family:system-ui,-apple-system,sans-serif;text-align:center;max-width:420px;margin:0 auto}
  #hoja b{display:block;font-size:17px;color:#1B1415;margin-bottom:4px}
  #hoja span{display:block;font-size:14px;color:#7B6F70;line-height:1.4}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-512.png" alt="Carnes La Ermita"><div style="text-align:center">Cargando pedidos…</div></div></div>
<script>
  // Enlace de la aplicación web de Apps Script (termina en /exec)
  var EXEC = "https://script.google.com/macros/s/AKfycbx9whr0i8j4DMhuGydpvtXli5lIWxiq545MBosLZ5Tr4EsHHAPrQKnhrYA3pmC6XFCC/exec";
  // Clave pública de los avisos (debe ser la misma de VAPID_PUBLICA_DEFECTO en Código.gs)
  var VAPID = "BAyxDJpOMglZAyqAakLi8wYy9LiTFz0OUg3iMfm8_f5n0RQj_Hz531oPTrzjPy3Aa-tQLIwOhv1Z1VhoMZmkaaY";

  var ua = navigator.userAgent || "";
  var esIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var esSafari = /^((?!chrome|chromium|android|crios|fxios|edg).)*safari/i.test(ua);
  var directo = location.search.indexOf("directo") >= 0;
  var quiereActivar = location.search.indexOf("activar") >= 0;
  var instalada = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  var soportaPush = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
  var splash = document.getElementById("splash");
  var regP = ("serviceWorker" in navigator) ? navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; }) : Promise.reject("sin sw");
  regP.catch(function () {});

  function dispositivo() { return esIOS ? "iPhone" : /Android/i.test(ua) ? "Android" : "Computador"; }
  function claveBytes(k) {
    var s = (k || VAPID).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o;
  }
  function b64url(t) { return btoa(unescape(encodeURIComponent(t))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function mismaClave(s, k) {
    try { var a = new Uint8Array(s.options.applicationServerKey), b = claveBytes(k); if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; } catch (e) { return true; }
  }
  // Suscribe este celular. Debe llamarse justo después de un toque (el celular pide permiso).
  function suscribir(reg, k) {
    return reg.pushManager.getSubscription().then(function (s) {
      if (s && !mismaClave(s, k)) return s.unsubscribe().then(function () { return null; });
      return s;
    }).then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveBytes(k) }); });
  }
  // Igual que suscribir, pero llama al navegador en el mismo instante del toque (iPhone lo exige).
  function suscribirYa(reg, k) {
    return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveBytes(k) })
      .catch(function () { return suscribir(reg, k); });
  }
  function saltadoReciente() { try { return Date.now() - Number(localStorage.getItem("ermita-push-luego") || 0) < 3 * 864e5; } catch (e) { return false; } }
  function luego() { try { localStorage.setItem("ermita-push-luego", String(Date.now())); } catch (e) {} }

  function pantallaActivar(onSi, onNo) {
    splash.classList.remove("oculto");
    splash.innerHTML = '<div style="text-align:center;padding:24px;max-width:340px">' +
      '<img src="icon-512.png" alt="Carnes La Ermita" style="width:120px">' +
      '<div style="font-size:20px;font-weight:700;color:#1B1415;margin-bottom:6px">Activa los avisos</div>' +
      '<div style="font-size:14px;line-height:1.5;color:#7B6F70;margin-bottom:10px">Te llegará un aviso con el logo cuando haya un pedido nuevo, un cambio de estado o un mensaje del chat.</div>' +
      '<button class="pbtn" id="p-si">Activar avisos</button><br><button class="pbtn sec" id="p-no">Ahora no</button></div>';
    document.getElementById("p-si").onclick = onSi;
    document.getElementById("p-no").onclick = onNo;
  }

  if ((esIOS || esSafari) && !instalada && !directo) {
    // iPhone en Safari: pantalla de bienvenida para poder instalar con el logo antes de abrir.
    splash.innerHTML =
      '<div style="text-align:center;padding:24px;max-width:340px">' +
      '<img src="icon-512.png" alt="Carnes La Ermita">' +
      '<div style="font-size:20px;font-weight:700;color:#1B1415;margin-bottom:6px">Pedidos La Ermita</div>' +
      '<a class="pbtn" href="' + EXEC + '" style="margin-bottom:22px">Abrir pedidos</a>' +
      '<div style="font-size:14px;line-height:1.5;color:#7B6F70">Para instalarla en este iPhone: toca <b>Compartir</b> ' +
      '<span style="display:inline-block;border:1.5px solid #7B6F70;border-radius:4px;padding:0 4px">&#8679;</span> abajo y elige <b>Agregar a inicio</b>. ' +
      'Así también te llegan los avisos.</div></div>';
  } else if (esIOS || esSafari || directo) {
    // Safari bloquea que Google se abra dentro de otra página (error 401), así que se abre directo.
    // Antes de abrir, se activan los avisos de este iPhone y se le pasan a la app.
    var ido = false;
    var irApp = function (extra) { if (ido) return; ido = true; location.replace(EXEC + (extra ? "?" + extra : "")); };
    var conSub = function (s) { irApp("push=" + b64url(JSON.stringify(s.toJSON())) + "&disp=" + dispositivo()); };
    var estado = function () { return "pushest=" + (Notification.permission === "denied" ? "denegado" : "pendiente"); };
    if (!soportaPush || directo) irApp(soportaPush ? "" : "pushest=no");
    else {
      setTimeout(function () { if (!document.getElementById("p-si")) irApp(); }, 5000);
      regP.then(function (reg) {
        var perm = Notification.permission;
        if (perm === "granted") return suscribir(reg).then(conSub, function () { irApp("pushest=error"); });
        if (perm === "denied" || (!quiereActivar && saltadoReciente())) return irApp(estado());
        pantallaActivar(function () {
          this.disabled = true; this.textContent = "Activando…";
          suscribirYa(reg).then(conSub, function () { irApp(estado()); });
        }, function () { luego(); irApp(estado()); });
      }, function () { irApp("pushest=no"); });
    }
  } else {
    var f = document.createElement("iframe");
    f.id = "app";
    f.title = "Pedidos La Ermita";
    f.setAttribute("allow", "clipboard-write; microphone; fullscreen");
    f.src = EXEC;
    document.body.appendChild(f);
    f.addEventListener("load", function () { splash.classList.add("oculto"); });
    setTimeout(function () { splash.classList.add("oculto"); }, 8000);

    // La app (dentro de Google) pregunta por los avisos con mensajes; aquí se activan.
    var hoja = null;
    var quitarHoja = function () { if (hoja) { hoja.remove(); hoja = null; } };
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d || typeof d.ermita !== "string" || d.ermita.indexOf("push-") !== 0) return;
      if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(e.origin)) return;
      var src = e.source;
      var resp = function (x) { x.ermita = "push"; x.modo = "iframe"; x.disp = dispositivo(); x.soporta = soportaPush;
        x.permiso = soportaPush ? Notification.permission : "no"; try { src.postMessage(x, "*"); } catch (_) {} };
      if (!soportaPush) return resp({ sub: null });
      regP.then(function (reg) {
        if (d.ermita === "push-estado") {
          reg.pushManager.getSubscription().then(function (s) {
            if (Notification.permission === "granted" && (!s || !mismaClave(s, d.vapid))) return suscribir(reg, d.vapid).catch(function () { return null; });
            return s;
          }).then(function (s) { resp({ sub: s ? s.toJSON() : null }); });
        } else if (d.ermita === "push-activar") {
          var hecho = function (s) { quitarHoja(); resp({ sub: s.toJSON(), nuevo: true }); };
          var fallo = function (err) {
            if (Notification.permission === "default" && !hoja) {
              // El navegador pidió un toque aquí mismo: se muestra un botón propio.
              hoja = document.createElement("div"); hoja.id = "hoja";
              hoja.innerHTML = '<b>Activar avisos</b><span>Toca el botón para permitir los avisos en este celular.</span>' +
                '<button class="pbtn" id="h-si">Activar avisos</button><br><button class="pbtn sec" id="h-no">Ahora no</button>';
              document.body.appendChild(hoja);
              document.getElementById("h-si").onclick = function () { suscribirYa(reg, d.vapid).then(hecho, function (e2) { quitarHoja(); resp({ sub: null, error: String(e2 && e2.message || e2) }); }); };
              document.getElementById("h-no").onclick = function () { quitarHoja(); resp({ sub: null }); };
            } else resp({ sub: null, error: String(err && err.message || err) });
          };
          (Notification.permission === "granted" ? suscribir(reg, d.vapid) : suscribirYa(reg, d.vapid)).then(hecho, fallo);
        } else if (d.ermita === "push-desactivar") {
          reg.pushManager.getSubscription().then(function (s) { return s ? s.unsubscribe() : true; })
            .then(function () { resp({ sub: null }); }, function () { resp({ sub: null }); });
        }
      }, function () { resp({ sub: null, error: "sin service worker" }); });
    });
  }
</script>
</body>
</html>
