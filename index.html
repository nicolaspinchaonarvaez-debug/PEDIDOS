<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos La Ermita</title>
<meta name="theme-color" content="#B3161E">
<meta name="description" content="Pedidos y domicilios de Carnes La Ermita">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos Ermita">
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;display:grid;place-items:center;background:#FFFFFF;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#7B6F70;transition:opacity .3s}
  #splash img{width:160px;max-width:50vw;display:block;margin:0 auto 14px}
  #splash.oculto{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-512.png" alt="Carnes La Ermita"><div style="text-align:center">Cargando pedidos…</div></div></div>
<iframe id="app" title="Pedidos La Ermita"
  allow="clipboard-write; microphone; fullscreen"
  src="https://script.google.com/macros/s/AKfycbx9whr0i8j4DMhuGydpvtXli5lIWxiq545MBosLZ5Tr4EsHHAPrQKnhrYA3pmC6XFCC/exec"></iframe>
<script>
  var f=document.getElementById("app"),s=document.getElementById("splash");
  f.addEventListener("load",function(){s.classList.add("oculto")});
  setTimeout(function(){s.classList.add("oculto")},8000);
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
